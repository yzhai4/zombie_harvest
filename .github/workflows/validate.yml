name: Validate zombie-harvest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check dist/actor-sprites.js
          node --check prototype/mobile-zombie-game/game.js
          node scripts/check-inline-syntax.mjs
          node --check scripts/verify-three-days-artifacts.mjs
          node --check scripts/export-three-days-artifacts.mjs
          node --check scripts/runtime-source-target.mjs
          node --check scripts/check-report-recovery.mjs
          node --check scripts/check-plan-integrity.mjs
          node --check scripts/check-plan-integrity-ui.mjs
          node --check scripts/check-command-id-reservation.mjs
          node --check scripts/check-repair-proof.mjs
          node --check scripts/check-leader-llm-harness.mjs
          node --check scripts/check-leader-harness-replay.mjs
          node --check scripts/headless-leader-ledger-adapter.mjs
          node --check scripts/check-leader-command-bridge.mjs
          node --check scripts/check-leader-command-bridge-runtime.mjs
          node --check scripts/check-daytime-combat.mjs
          node --check scripts/check-combat-intent-v1.mjs
          node --check scripts/lib/combat-intent-v1.mjs
      - name: Check deployable entrypoints
        run: |
          test -s dist/index.html
          test -s prototype/mobile-zombie-game/index.html
          grep -q '<html' dist/index.html
          grep -q '<html' prototype/mobile-zombie-game/index.html
      - name: Validate content and night boundaries
        run: |
          node scripts/validate-content.mjs
          node scripts/check-night-guard.mjs
      - name: Execute registered-chain reducers
        run: node scripts/check-content-chain.mjs
      - name: Execute calendar, plan and camp input contracts
        run: |
          node scripts/check-plan-day.mjs
          node scripts/check-camp-area.mjs
          node scripts/check-plan-integrity.mjs
          node scripts/check-plan-integrity-ui.mjs --html dist/index.html --io-adapter scripts/check-report-recovery.mjs --legacy-fixture scripts/fixtures/plan-integrity/plan-committed-legacy-basewriter.json --out "$RUNNER_TEMP/plan-integrity-ui.json"
      - name: Execute save recovery and session lifecycle contracts
        run: node scripts/check-report-recovery.mjs
      - name: Execute command numbering and repair proof contracts
        run: |
          node scripts/check-command-id-reservation.mjs --html dist/index.html --io-adapter scripts/check-report-recovery.mjs --out "$RUNNER_TEMP/command-id-reservation.json"
          node scripts/check-repair-proof.mjs --html dist/index.html --io-adapter scripts/check-report-recovery.mjs --legacy-repair-fixture scripts/fixtures/repair-proof/repair-legacy-basewriter.json --out "$RUNNER_TEMP/repair-proof.json"
      - name: Execute leader LLM harness contract
        run: node scripts/check-leader-llm-harness.mjs
      - name: Execute leader harness replay contract
        run: node scripts/check-leader-harness-replay.mjs
      - name: Execute headless leader adapter contract
        run: node scripts/headless-leader-ledger-adapter.mjs
      - name: Execute leader CommandBus bridge contract
        run: |
          node scripts/check-leader-command-bridge.mjs
          node scripts/check-leader-command-bridge-runtime.mjs
      - name: Execute daytime combat contract
        run: |
          node scripts/check-daytime-combat.mjs
          node scripts/check-combat-intent-v1.mjs
      - name: Verify save projections and static smoke
        run: |
          node scripts/replay-harness.mjs --self-test
          node scripts/smoke-three-days.mjs
      - name: Check browser runner syntax
        run: |
          python -m py_compile scripts/server-playtest.py scripts/server-content-chain.py scripts/server-three-days.py
          python -m py_compile scripts/server-report-recovery.py scripts/report_recovery_fixtures.py scripts/report_recovery_full.py
