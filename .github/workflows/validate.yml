name: Validate zombie-harvest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check dist/actor-sprites.js
          node --check prototype/mobile-zombie-game/game.js
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('dist/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', html, re.S | re.I)
          for i, script in enumerate(scripts):
              Path(f'/tmp/zombie-inline-{i}.js').write_text(script, encoding='utf-8')
          print(f'extracted {len(scripts)} inline scripts')
          PY
          for script in /tmp/zombie-inline-*.js; do node --check "$script"; done
      - name: Check deployable entrypoints
        run: |
          test -s dist/index.html
          test -s prototype/mobile-zombie-game/index.html
          grep -q '<html' dist/index.html
          grep -q '<html' prototype/mobile-zombie-game/index.html
