name: Desktop invitation public pilot
on:
  push:
    branches: [qa/desktop-invitation-20261020]
    paths: [.github/workflows/desktop-invitation-pilot-20261020.yml]
permissions:
  contents: read
  actions: read
jobs:
  public-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            dist
            scripts/qa-desktop-invitation-pilot-20261020.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded browser dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Execute original desktop build through public UI
        env:
          PUBLIC_ACTIONS_JSON: '[]'
        run: python scripts/qa-desktop-invitation-pilot-20261020.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-invitation-public-prefix-01
          retention-days: 3
          if-no-files-found: error
          include-hidden-files: true
          path: qa-output
