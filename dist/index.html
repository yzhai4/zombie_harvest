<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=yes" />
  <meta name="theme-color" content="#0b1117" />
  <title>我是大救星 · 尸潮农场</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2712%27 fill=%27%232d382d%27/%3E%3Ctext x=%2732%27 y=%2747%27 text-anchor=%27middle%27 font-size=%2743%27%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0b1117;
      --bg-2: #121c22;
      --panel: rgba(19, 31, 37, .94);
      --panel-soft: rgba(28, 44, 49, .86);
      --line: rgba(224, 236, 203, .12);
      --cream: #f7f1cf;
      --muted: #9eafa1;
      --green: #b7d96f;
      --green-dark: #304b32;
      --orange: #f7a44d;
      --red: #ed6b5c;
      --blue: #6fc4d4;
      --purple: #c99bea;
      --shadow: 0 16px 38px rgba(0, 0, 0, .28);
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--cream); font-family: ui-rounded, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    body { min-height: 100svh; overflow-x: hidden; }
    button { font: inherit; border: 0; color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .app {
      width: min(100%, 520px);
      min-height: 100svh;
      margin: 0 auto;
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(24px + env(safe-area-inset-bottom));
      position: relative;
      background:
        radial-gradient(circle at 15% 0%, rgba(74, 137, 107, .12), transparent 30%),
        radial-gradient(circle at 90% 22%, rgba(146, 86, 54, .12), transparent 28%),
        linear-gradient(180deg, #0b1117 0%, #11191e 68%, #0d1419 100%);
    }
    .brand-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
    .brand-kicker { font-size: 10px; letter-spacing: .22em; color: var(--green); text-transform: uppercase; font-weight: 800; }
    h1 { font-size: 25px; margin: 4px 0 2px; letter-spacing: -.04em; }
    .subtitle { color: var(--muted); font-size: 12px; }
    .version-stamp { display: inline-block; margin-top: 5px; padding: 3px 7px; border: 1px solid rgba(183,217,111,.24); border-radius: 999px; color: var(--green); background: rgba(183,217,111,.08); font-size: 9px; font-weight: 800; letter-spacing: .02em; }
    .day-badge { min-width: 88px; padding: 10px 12px; border-radius: 16px; background: rgba(31, 49, 52, .84); border: 1px solid var(--line); text-align: right; }
    .day-badge strong { display: block; font-size: 14px; color: var(--green); }
    .day-badge span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; }
    .resource-strip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 10px; }
    .resource { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 8px 8px 7px; box-shadow: var(--shadow); min-width: 0; }
    .resource .label { display: flex; align-items: center; gap: 4px; color: var(--muted); font-size: 9px; white-space: nowrap; }
    .resource .resource-sub { display:block; margin-top:2px; color:var(--muted); font-size:8px; line-height:1.2; }
    .resource .value { margin-top: 3px; font-weight: 800; font-size: 16px; }
    .resource .value.warn { color: var(--orange); }
    .resource .value.good { color: var(--green); }
    .resource:nth-child(1), .resource:nth-child(3), .resource:nth-child(6) { border-top: 2px solid var(--green); }
    .resource:nth-child(2), .resource:nth-child(5) { border-top: 2px solid var(--orange); }
    .resource:nth-child(4) { border-top: 2px solid var(--purple); }
    .mission { display: flex; align-items: center; gap: 9px; border: 1px solid rgba(183, 217, 111, .19); background: rgba(44, 70, 48, .42); padding: 10px 12px; border-radius: 15px; margin-bottom: 10px; }
    .mission-icon { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 9px; background: rgba(183, 217, 111, .18); }
    .mission-copy { flex: 1; min-width: 0; }
    .mission-copy b { display: block; font-size: 12px; }
    .mission-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .mission-progress { width: 54px; height: 6px; overflow: hidden; border-radius: 8px; background: rgba(255, 255, 255, .08); }
    .mission-progress i { display: block; width: 25%; height: 100%; border-radius: inherit; background: var(--green); transition: width .3s ease; }
    .relay-panel { display: none; margin-bottom: 10px; padding: 11px 12px; border-radius: 17px; border: 1px solid rgba(111,196,212,.24); background: linear-gradient(135deg, rgba(23, 50, 58, .92), rgba(18, 31, 37, .94)); box-shadow: var(--shadow); }
    .relay-panel.open { display: block; }
    .relay-panel .panel-top { margin-bottom: 8px; }
    .relay-panel .panel-title { color: var(--blue); }
    .relay-status { color: var(--muted); font-size: 10px; }
    .relay-status strong { color: var(--blue); }
    .relay-progress { height: 7px; overflow: hidden; margin-top: 8px; border-radius: 99px; background: rgba(255,255,255,.08); }
    .relay-progress i { display: block; width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), var(--green)); transition: width .3s ease; }
    .relay-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 8px; }
    .relay-meta-card { min-width: 0; padding: 8px; border-radius: 11px; background: rgba(255,255,255,.05); }
    .relay-meta-card b { display: block; color: var(--cream); font-size: 10px; }
    .relay-meta-card span { display: block; margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.35; }
    .relay-steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 9px; }
    .relay-step { min-width: 0; padding: 5px 3px; border-radius: 8px; background: rgba(255,255,255,.045); color: rgba(247,241,207,.45); text-align: center; font-size: 8px; line-height: 1.25; }
    .relay-step.done { color: var(--green); background: rgba(183,217,111,.12); }
    .relay-step.current { color: var(--blue); background: rgba(111,196,212,.13); box-shadow: inset 0 0 0 1px rgba(111,196,212,.28); }
    .relay-materials { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 8px; }
    .relay-material { padding: 6px 4px; border-radius: 8px; background: rgba(255,255,255,.045); color: var(--muted); text-align: center; font-size: 8px; }
    .relay-material strong { display: block; color: var(--cream); font-size: 11px; }
    .relay-crew { margin-top: 8px; color: rgba(247,241,207,.7); font-size: 9px; line-height: 1.45; }
    .relay-crew em { color: var(--orange); font-style: normal; }
    .event-panel { margin-bottom: 10px; padding: 11px 12px; border-radius: 17px; border: 1px solid rgba(247,164,77,.22); background: linear-gradient(135deg, rgba(65,47,35,.88), rgba(33,37,34,.92)); box-shadow: var(--shadow); }
    .event-head { display: flex; align-items: center; gap: 8px; }
    .event-icon { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: rgba(247,164,77,.17); font-size: 18px; }
    .event-copy { flex: 1; min-width: 0; }
    .event-copy b { display: block; font-size: 12px; }
    .event-copy span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; line-height: 1.4; }
    .event-state { color: var(--orange); font-size: 9px; font-weight: 800; white-space: nowrap; }
    .event-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 9px; }
    .event-choice { min-height: 36px; padding: 6px 8px; border-radius: 11px; background: rgba(255,255,255,.07); border: 1px solid rgba(247,241,207,.12); text-align: left; font-size: 10px; font-weight: 800; }
    .event-choice:active { transform: scale(.98); }
    .event-choice small { display: block; margin-top: 2px; color: var(--muted); font-size: 8px; font-weight: 600; }
    .event-choice:disabled { opacity: .42; cursor: not-allowed; }
    .world-wrap { position: relative; border-radius: 22px; background: #263c35; border: 1px solid rgba(197, 225, 157, .18); padding: 8px; box-shadow: var(--shadow); overflow: hidden; }
    .world-wrap::before { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(135deg, rgba(255,255,255,.06), transparent 34%, rgba(0,0,0,.16)); z-index: 2; }
    .world-header { position: absolute; z-index: 3; top: 14px; left: 14px; right: 14px; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
    .weather-pill, .map-location-pill, .alert-pill { backdrop-filter: blur(12px); background: rgba(10, 20, 22, .55); border: 1px solid rgba(240, 245, 214, .15); border-radius: 999px; padding: 7px 10px; font-size: 10px; color: var(--cream); }
    .map-location-pill { position: absolute; left: 50%; transform: translateX(-50%); color: var(--blue); white-space: nowrap; }
    .alert-pill { color: var(--orange); }
    .world { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(7, 1fr); gap: 2px; aspect-ratio: 10 / 7; border-radius: 16px; overflow: hidden; background: #20372e; position: relative; contain: layout paint style; }
    .tile { position: relative; display: grid; place-items: center; min-width: 0; min-height: 0; font-size: clamp(15px, 5vw, 25px); background: #5c8b56; user-select: none; transition: filter .15s ease, transform .15s ease; }
    .tile:nth-child(3n) { background: #638f58; }
    .tile:nth-child(4n) { background: #568251; }
    .tile.path { background: #98764f; }
    .tile.water, .tile.terrain-water { background: #438a93; }
    .tile.terrain-forest { background: #3f6948; }
    .tile.terrain-wetland { background: #4c7770; }
    .tile.terrain-farmland { background: #8a7650; }
    .tile.terrain-ruins { background: #5e5f59; }
    .tile.terrain-grass { background: #5c8b56; }
    .tile.fogged { background: #26353a !important; filter: saturate(.18) brightness(.58); }
    .tile.fogged .ground-speck { opacity: .18; }
    .tile .map-decor { position: relative; z-index: 1; opacity: .7; font-size: .55em; filter: saturate(.76); pointer-events: none; }
    .tile.target-lock { outline: 2px solid var(--yellow); outline-offset: -2px; box-shadow: 0 0 0 2px rgba(255,212,92,.22), inset 0 0 18px rgba(255,212,92,.16); }
    .tile.camp-area.zone-eastOutpost { background: linear-gradient(145deg, #744b3f, #4f3732); border-color: rgba(237,107,92,.38); }
    .tile.camp-area.zone-farmland { background: linear-gradient(145deg, #7c6b43, #51482f); border-color: rgba(247,164,77,.36); }
    .tile.camp-area.zone-riverBank { background: linear-gradient(145deg, #3b7077, #2b4d57); border-color: rgba(111,196,212,.38); }
    .tile.highlight { outline: 3px solid var(--green); outline-offset: -3px; filter: brightness(1.18); z-index: 2; }
    .tile.cursor { outline: 2px solid var(--blue); outline-offset: -2px; filter: brightness(1.12); z-index: 3; }
    .tile.build-target { box-shadow: inset 0 0 0 3px rgba(247, 164, 77, .85); }
    .tile.large-building { background: linear-gradient(145deg, rgba(91,70,58,.96), rgba(47,54,52,.96)); box-shadow: inset 0 0 0 2px rgba(247,241,207,.24); }
    .tile.large-building .tag { color: var(--cream); background: rgba(18,25,28,.82); }
    .tile.large-building .entity { display: block; width: 100%; height: 100%; font-size: 1.15em; }
    .tile.large-building .building-piece { position: relative; z-index: 1; display: block; width: 100%; height: 100%; line-height: 0; filter: drop-shadow(0 3px 2px rgba(0,0,0,.3)); }
    .tile.large-building .building-piece svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; image-rendering: pixelated; }
    .tile.large-building.is-building-anchor .building-piece { filter: drop-shadow(0 4px 2px rgba(0,0,0,.38)); }
    .tile.building-footprint { border: 1px solid rgba(247,241,207,.08); }
    .tile .ground-speck { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(39, 79, 42, .34); left: 23%; top: 27%; }
    .tile .ground-speck.s2 { left: 70%; top: 72%; width: 2px; height: 2px; }
    .tile .entity { position: relative; z-index: 1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.28)); line-height: 1; }
    .pixel-sprite { display: inline-block; width: 1.35em; height: 1.35em; flex: 0 0 auto; background-image: var(--pixel-sprite-image); background-position: center; background-repeat: no-repeat; background-size: contain; image-rendering: pixelated; vertical-align: middle; }
    .actor-sprite > svg { display: block; width: 100%; height: 100%; shape-rendering: crispEdges; image-rendering: pixelated; }
    .tile .pixel-sprite { width: 1.6em; height: 1.6em; }
    .tile .pixel-sprite, .continuous-entity .pixel-sprite { filter: drop-shadow(0 3px 1px rgba(12,22,20,.42)); transform: translateY(-4%); }
    .tile.building-footprint .pixel-sprite { transform: translateY(-8%); filter: drop-shadow(0 5px 2px rgba(12,22,20,.5)); }
    .tile.building-footprint.is-building-anchor::after { content: ''; position: absolute; left: 12%; right: 12%; bottom: 8%; height: 14%; border-radius: 50%; background: rgba(10,19,18,.28); filter: blur(2px); pointer-events: none; }
    .continuous-entity .pixel-sprite { width: 1.55em; height: 1.55em; }
    .survivor-icon .pixel-sprite, .build-icon .pixel-sprite, .inventory-icon .pixel-sprite { width: 1.45em; height: 1.45em; }
    .tile .tag { position: absolute; z-index: 2; bottom: 3px; left: 50%; transform: translateX(-50%); background: rgba(10, 24, 22, .65); padding: 2px 5px; border-radius: 5px; color: #fff; font-size: 8px; white-space: nowrap; }
    .tile .hp { position: absolute; top: 3px; left: 5px; right: 5px; height: 3px; border-radius: 99px; background: rgba(0,0,0,.3); overflow: hidden; }
    .tile .hp i { display: block; height: 100%; background: var(--red); }
    .tile.player .entity { animation: bob 1.2s ease-in-out infinite; }
    .tile.zombie .entity { animation: shamble 1.1s ease-in-out infinite; }
    .tile.npc .entity { animation: bob 1.8s ease-in-out infinite; }
    .tile.fx-hit { animation: tileHit .3s ease; box-shadow: inset 0 0 0 3px rgba(247,164,77,.92), 0 0 12px rgba(247,164,77,.6); }
    .tile.fx-dead { filter: grayscale(.72) brightness(1.2); box-shadow: inset 0 0 0 3px rgba(237,107,92,.8); }
    .tile.npc.injured .entity { filter: saturate(.72) drop-shadow(0 0 5px rgba(247,164,77,.8)); }
    .tile.npc.critical .entity { animation: npcCritical .55s ease-in-out infinite; filter: saturate(.56) drop-shadow(0 0 7px rgba(237,107,92,.95)); }
    .player-marker { position: absolute; z-index: 4; display: grid; place-items: center; pointer-events: none; transition: left .1s linear, top .1s linear, filter .12s ease; will-change: left, top; }
    .player-marker .entity { position: relative; font-size: clamp(18px, 4.3vw, 31px); line-height: 1; filter: drop-shadow(0 4px 3px rgba(0,0,0,.42)); animation: bob 1.2s ease-in-out infinite; }
    .player-marker.step { animation: player-step .18s linear both; }
    .continuous-entity-layer { position: absolute; inset: 0; z-index: 12; pointer-events: none; overflow: hidden; }
    .actor-canvas { position: absolute; inset: 0; z-index: 12; width: 100%; height: 100%; pointer-events: none; image-rendering: pixelated; }
    .continuous-entity { position: absolute; display: grid; place-items: center; transform: translate(-50%, -50%); pointer-events: auto; font-size: clamp(15px, 2.6vw, 28px); line-height: 1; filter: drop-shadow(0 3px 2px rgba(0,0,0,.38)); transition: left .28s linear, top .28s linear; will-change: left, top; }
    .continuous-entity.distant { opacity: .78; filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); }
    .continuous-entity.distant .pixel-sprite { width: 1.05em; height: 1.05em; }
    .continuous-entity.npc { animation: bob 1.8s ease-in-out infinite; }
    .continuous-entity.zombie { animation: shamble 1.1s ease-in-out infinite; }
    .continuous-entity > span:first-child { display: grid; place-items: center; min-width: 0; min-height: 0; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; image-rendering: pixelated; }
    .continuous-entity::after { content: ""; position: absolute; z-index: -1; left: 50%; bottom: 7%; width: 48%; height: 10%; border-radius: 50%; background: rgba(8,17,18,.48); filter: blur(1px); transform: translateX(-50%); pointer-events: none; }
    .continuous-entity.npc > span:first-child { border: 0; background: transparent; box-shadow: none; }
    .continuous-entity.npc.focused > span:first-child { filter: drop-shadow(0 0 4px var(--npc-accent, rgba(183,217,111,.9))); }
    .continuous-entity.zombie > span:first-child { border: 0; border-radius: 0; background: transparent; box-shadow: none; }
    .continuous-entity.zombie.runner > span:first-child, .continuous-entity.zombie.brute > span:first-child { border: 0; box-shadow: none; }
    .continuous-entity .continuous-label { position: absolute; top: 100%; left: 50%; max-width: 11em; overflow: hidden; text-overflow: ellipsis; transform: translateX(-50%); font-size: 8px; white-space: nowrap; color: #fff; background: rgba(10,24,22,.72); padding: 2px 4px; border-radius: 4px; }
    .continuous-entity .continuous-role, .continuous-entity .continuous-threat { position: absolute; right: -7px; top: -7px; min-width: 14px; padding: 1px 3px; border-radius: 5px; color: #102019; background: var(--npc-accent, var(--yellow)); font-size: 7px; font-weight: 950; text-align: center; }
    .continuous-entity .continuous-threat { color: #fff; background: var(--enemy-accent, var(--red)); }
    .continuous-entity .continuous-hp { position: absolute; left: -30%; right: -30%; top: -8px; height: 3px; border-radius: 99px; background: rgba(0,0,0,.42); overflow: hidden; }
    .continuous-entity .continuous-hp i { display: block; height: 100%; background: var(--red); }
    .continuous-motion .tile.player > *, .continuous-motion .tile.npc > *, .continuous-motion .tile.zombie > * { visibility: hidden; }
    .world.continuous-motion { gap: 0; }
    .world.continuous-motion .tile { border-radius: 0; }
    @keyframes player-step { from { left: var(--marker-start-left); top: var(--marker-start-top); } to { left: var(--marker-end-left); top: var(--marker-end-top); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    @keyframes shamble { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(1px); } }
    @keyframes tileHit { 50% { transform: scale(1.07); filter: brightness(1.75); } }
    @keyframes npcCritical { 50% { transform: translateX(2px) rotate(4deg); } }
    .world-effect { position: absolute; z-index: 16; display: grid; place-items: center; width: 10%; height: 12%; pointer-events: none; font-size: clamp(11px, 1.5vw, 17px); font-weight: 950; text-shadow: 0 2px 4px rgba(0,0,0,.65); transform: translate(-50%, -50%); animation: worldEffectFloat .85s ease-out forwards; }
    .world-effect.damage { color: var(--orange); }
    .world-effect.player-hit, .world-effect.npc-state, .world-effect.breach { color: var(--red); }
    .world-effect.death { color: #ffcf82; font-size: clamp(16px, 2.1vw, 25px); animation-name: worldEffectBurst; }
    .world-effect.heal { color: var(--green); }
    @keyframes worldEffectFloat { from { opacity: 1; margin-top: 1%; } to { opacity: 0; margin-top: -9%; } }
    @keyframes worldEffectBurst { from { opacity: 1; transform: translate(-50%,-50%) scale(.65); } 45% { transform: translate(-50%,-58%) scale(1.2); } to { opacity: 0; transform: translate(-50%,-78%) scale(1); } }
    .map-legend { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 7px 3px 0; color: rgba(247,241,207,.7); font-size: 9px; }
    .map-legend span { display: inline-flex; align-items: center; gap: 4px; }
    .legend-dot { width: 7px; height: 7px; display: inline-block; border-radius: 50%; background: var(--green); }
    .legend-dot.wild { background: #3f6948; }
    .legend-dot.landmark { background: var(--blue); }
    .legend-dot.gate { background: var(--red); }
    .world-footer { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; padding: 0 3px 1px; font-size: 10px; color: rgba(247, 241, 207, .74); }
    .energy-bar { display: flex; align-items: center; gap: 7px; flex: 1; }
    .energy-bar span { white-space: nowrap; }
    .meter { height: 7px; border-radius: 99px; overflow: hidden; background: rgba(6, 18, 17, .4); flex: 1; }
    .meter i { display: block; height: 100%; width: 78%; border-radius: inherit; background: linear-gradient(90deg, var(--orange), var(--green)); transition: width .25s ease; }
    .game-panel { margin-top: 10px; border: 1px solid rgba(111,196,212,.18); border-left: 3px solid var(--blue); background: linear-gradient(135deg, rgba(19,31,37,.97), rgba(17,30,36,.88)); border-radius: var(--radius); padding: 12px; box-shadow: var(--shadow); }
    .panel-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .panel-title { font-size: 13px; font-weight: 800; }
    .panel-help { color: var(--muted); font-size: 10px; }
    .action-row { display: grid; grid-template-columns: 1.15fr 1fr 1fr; gap: 8px; margin-top: 10px; }
    .utility-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    .utility-row .action-btn { min-height: 41px; }
    .survival-strip { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
    .survival-strip .energy-bar { min-width: 0; }
    .feed-btn { display: flex; flex: 0 0 88px; min-height: 36px; align-items: center; justify-content: center; flex-direction: column; border-radius: 12px; padding: 6px 8px; background: #e8bc6f; color: #271c13; font-size: 11px; font-weight: 900; }
    .feed-btn:disabled { opacity: .42; filter: grayscale(.55); }
